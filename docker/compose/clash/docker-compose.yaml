services:
  metacubexd:
    image: ghcr.io/metacubex/metacubexd-server:latest
    container_name: metacubexd
    restart: unless-stopped
    environment:
      CONTROL_TOKEN: '${CONTROL_TOKEN:?Set CONTROL_TOKEN in .env}'
      CLASH_SECRET: '${CLASH_SECRET:?Set CLASH_SECRET in .env}'
      GITHUB_TOKEN: '${GITHUB_TOKEN:-}'
      DEFAULT_BACKEND_URL: '${DEFAULT_BACKEND_URL:-}'
      CONTROL_PORT: '8080'
      CLASH_API_PORT: '9090'
      MIXED_PORT: '7890'
      TZ: '${TZ:-Asia/Shanghai}'
    ports:
      - '17895:8080' # dashboard UI + /api/control agent API
      - '17894:9090' # Mihomo external-controller API + WebSocket
      - '7890:7890'  # mixed HTTP/SOCKS proxy port
    volumes:
      # Profiles, active config, kernel downloads, and caches must be writable.
      - './data:/data'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/api/control/health']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
