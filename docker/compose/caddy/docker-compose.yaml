services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: always
    env_file: .env
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # Optional: Caddy admin / metrics endpoint (similar to Kong :8001)
      # - "2019:2019"
    volumes:
      # Caddyfile and certificates are read-only configuration.
      - ./config:/etc/caddy:ro
      # Runtime directories for certificates and Caddy's internal config.
      - ./data:/data
      - ./caddy_config:/config
    networks:
      - caddy-net

networks:
  caddy-net:
    external: false
