services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: always
    env_file: .env
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # Optional: Caddy admin / metrics endpoint (similar to Kong :8001)
      # - "2019:2019"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/caddy_data:/data
      - ./config/caddy_config:/config
      # Wildcard certificate for *.home.lan.
      # Copy wildcard.home.lan.crt and wildcard.home.lan.key into config/certs/.
      - ./config/certs:/etc/caddy/certs:ro
    networks:
      - caddy-net

networks:
  caddy-net:
    external: false
